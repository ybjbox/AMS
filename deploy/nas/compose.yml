# AMS 在飞牛 NAS 上的部署编排（自更新容器）
#
# 上传到 NAS 时是**平铺**的 4 个文件（NAS 侧构建上下文就是这个目录）：
#   /vol1/1000/Docker/ams/compose.yml
#   /vol1/1000/Docker/ams/runtime.Dockerfile
#   /vol1/1000/Docker/ams/entrypoint.sh
#   /vol1/1000/Docker/ams/.env          ← 只有 AMS_ADMIN_PASSWORD，不进仓库
# 仓库里放在 deploy/nas/ 只是版本管理的家；构建上下文不带仓库路径。
#
# 飞牛 Docker 面板可以直接"从 Compose 创建项目"指过来；也可以用 trim-cli 的
# `docker request appcgi.dockermgr.composeCreate` 建（见项目技能 deploy-ams-to-nas）。
#
# 没有特权容器、没有 docker.sock、没有镜像仓库：更新由容器内部的 entrypoint 完成。
name: ams

services:
  ams:
    build:
      context: .
      dockerfile: runtime.Dockerfile
    image: ams-runtime:latest
    container_name: ams
    restart: unless-stopped
    # 优先执行卷里那份（= main 上的 deploy/nas/entrypoint.sh）；卷里还没有才退回镜像副本。
    #
    # 为什么要绕：面板只在**新建项目**那一刻真的 build 过一次。之后点「启动/更新」和点
    # 「重新构建」，镜像 ID 都是同一个 sha256:53a526bcc850（2026-10-12 实测两次，其中 23:50
    # 那次 COPY 的源文件早已换过内容）—— 想改镜像里那份 entrypoint 只能删项目重建，代价太大。
    # 走这个覆盖之后，改 supervisor = git push + 一次「启动/更新」。
    #
    # 这条命令里**一个 $ 都不能有**：compose 会对它做变量插值，YAML 的单引号挡不住。写 `$e`
    # 会得到 `The "e" variable is not set. Defaulting to a blank string.`，容器实际执行的是
    # `exec bash ""` → Restarting (127)。要么 `$$e` 转义，要么像这样根本不引入变量。
    entrypoint:
      - /bin/sh
      - -c
      - 'if [ -f /app/deploy/nas/entrypoint.sh ]; then exec bash /app/deploy/nas/entrypoint.sh; else exec bash /usr/local/bin/entrypoint.sh; fi'
    ports:
      # 宿主 3100 → 容器 3000。**不是** 3000:3000：NAS 上 3000 是 MoviePilot 的
      # nginx 在用，而它跑 `network_mode: host`，在 `docker container ls` 的 Ports
      # 列里根本不出现 —— 只看映射表会以为 3000 是空的，起容器时才报 address already in use。
      # 容器内部端口保持 3000（runtime.Dockerfile 的 HEALTHCHECK 打的是 127.0.0.1:3000）。
      - "3100:3000"
    # 管理员口令只存在于 NAS 上的这个文件里，不进仓库、不进聊天
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "3000"
      # 业务按本地日历日判定；容器默认 UTC 会让考勤归属日、合同剩余天数、
      # 提醒的"今天"整体偏移 8 小时，而 CI 钉在 Asia/Shanghai 测不出来
      TZ: "Asia/Shanghai"
      DATA_DIR: "/app/data"
      # 自动更新的目标分支与轮询间隔（秒）
      REPO_URL: "https://github.com/ybjbox/AMS.git"
      BRANCH: "main"
      INTERVAL_SECONDS: "300"
      # 每份备份都带 uploads + 模板快照，只按天数删会没上界。
      # 256 MB 不是随手写的：本项目住在 /vol1（53 GB 的 SSD，与另外 10 个 compose
      # 项目和系统应用共用），清理掉三张安装 ISO 之后空闲也只有 ~10 GB。
      # 先前这里写 4096（4 GB）比这块盘的剩余空间还大 —— 等于"按容量清理"这道保险
      # 永远不会触发，写满只会 ENOSPC。份数上限 14 保持不动，由容量先收口。
      BACKUP_MAX_COUNT: "14"
      BACKUP_MAX_TOTAL_MB: "256"
    volumes:
      # 代码 + 构建产物 + node_modules 都在这个卷里：容器重建不用重新 npm ci，
      # 而 entrypoint 只做 git fetch 就能升到新版本
      - ams-code:/app
      # 数据用**宿主目录**而不是命名卷（学 MoviePilot 的 /config）：SQLite 库、每日备份、
      # 上传的图片、打印模板全在这里，在飞牛文件管理器里直接看得见 ——
      # 于是"手工拷一份到别的盘/网盘"这件事做得到，容器起不来时也拿得到 ams.db。
      # 用绝对路径而不是 ./data：compose 是客户端解析相对路径的，路径不一致会挂到空目录
      - /vol1/1000/Docker/ams/data:/app/data
      # npm 缓存单独一个卷：容器里重装依赖时不必重新下载几百 MB
      - ams-npm:/root/.npm
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      # 首次启动要 clone + npm ci + build + 建库，给足时间
      start_period: 300s

volumes:
  ams-code:
  ams-npm:
