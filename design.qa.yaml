project:
  name: ams
  baseUrl: http://127.0.0.1:3001
  outputDir: .design-qa

design:
  designMd: design-system/ams/MASTER.md
  screenSpec: docs/DESIGN-REVIEW.md

screens:
  - name: login-desktop
    mode: conformance
    expected:
      type: image
      path: .design-qa/expected/login-desktop.png
    app:
      url: /login
      viewport:
        width: 1370
        height: 770
      deviceScaleFactor: 1
      fullPage: false
      waitUntil: networkidle
      waitForSelector: body

uiAlignment:
  runVisualComparison: false
  runComponentAudit: true
  runDebtAudit: true
  runA11yAudit: true
  measurementTolerancePx: 1

code:
  include:
    - src/**/*.{ts,tsx,js,jsx,css,scss,html}
  exclude:
    - node_modules/**
    - dist/**
    - .design-qa/**
    - 'src/**/__tests__/**'
    - 'src/**/*.test.tsx'

components:
  libraryImportPatterns:
    - '@/components/ui'
  rawElementPolicy:
    button: prefer-design-system
    input: prefer-design-system
    select: prefer-design-system
    textarea: prefer-design-system
    dialog: prefer-design-system
  allowedRawElementFiles:
    - '**/components/ui/**'
    - src/pages/Settings/panels/ScriptsPanel.tsx  # 代码编辑器：等宽深色 textarea 是专用控件
    - src/index.css  # 仅注释里提到 <button>，不是 JSX
  # 契约类本身就是设计系统的一部分：.btn-* 与原生 file/hidden/checkbox/radio
  # 不是「绕过组件」，不纳入 bypass 计数（2026-10-27 裁定）。
  allowedRawElementPatterns:
    button:
      - 'className=[^>]*btn-(primary|secondary|danger|icon)'
    input:
      - 'type="(file|hidden|checkbox|radio|color)"'

a11y:
  disabledRules: []
  excludeSelectors:
    - '[data-a11y-ignore]'

debt:
  maxHardCodedColors: 0
  maxArbitraryTailwindValues: 5
  maxInlineStyles: 0
  allowedColorValues:
    - '#000'
    - '#fff'
    - '#000000'
    - '#ffffff'
    - transparent
  # 人工审阅后的债务扫描豁免（理由记录于此；扫描器输出 exemptedFiles 保持透明）
  excludeFiles:
    # 设计系统原语本身：tokens/shadows/几何在这里定义，功能代码不应再出现
    - src/components/ui/**
    # 全局契约与令牌定义文件（品牌色阶、print 媒体查询、滚动条等）
    - src/index.css
    # 测试夹具里的样例 HTML/色值不是 UI 代码
    - 'src/**/*.test.ts'
    - 'src/**/*.test.tsx'
    - 'src/**/__tests__/**'
    # 打印/导出链路：纸张尺寸必须用绝对 px/mm 与内联样式（打印窗口无 Tailwind 运行时），
    # 台卡/席位卡的 style 绑定是用户可配置值（themeColor/fontSize），内联是正确实现
    - src/pages/Documents/components/DocumentsPrintTemplate.tsx
    - src/pages/Seating/components/PrintPreview.tsx
    - src/pages/Seating/components/PrintSettingsModal.tsx
    - src/pages/NameCards/components/NameCardPreview.tsx
    - src/pages/Users/utils/printHtml.ts
    - src/pages/Users/components/PrintTemplates.tsx
    - src/pages/Users/hooks/useExport.ts
    # 台卡主题色默认值与打印 document.write 模板串（打印窗口无设计系统运行时）
    - src/pages/NameCards/constants.ts
    - src/pages/Users/constants.ts
    - src/pages/Users/components/UserDetailModal.tsx
    # 打印/导出 HTML：绝对 px 与硬编码色是正确实现（无 Tailwind 运行时）
    - src/pages/Documents/lib/printHtml.ts
    - src/pages/BusinessForms/lib/printHtml.ts
    - src/pages/MealVouchers/voucher.ts
    # 虚拟滚动定位、数据驱动柱高、用户自定义主题色：内联样式是唯一正确实现
    - src/components/users/UserTable.tsx
    - src/pages/Dashboard/components/WorkforceTrend.tsx
    - src/pages/Settings/panels/ThemesPanel.tsx
    # 组件尺寸集中配置、A4 预览、浮动助手拖拽几何：数值/内联是设计本身
    - src/config/widgetSizes.ts
    - src/pages/BusinessForms/index.tsx
    - src/pages/Contracts/components/ContractTable.tsx
    - src/pages/Dashboard/components/DepartmentAttendance.tsx
    - src/components/AiAssistant.tsx
    # 动态缩进/图表高度/进度宽度：数值由数据计算，内联是正确实现
    - src/components/common/TreeFilter.tsx
    - src/components/common/TreeSelect.tsx
    - src/pages/Attendance/components/ShiftRulesDialog.tsx
    - src/pages/Users/components/UserFormModal.tsx
    - src/pages/Dashboard/components/DashboardChart.tsx
    - src/pages/Dashboard/components/DepartmentDistribution.tsx
    - src/pages/Dashboard/components/StatCards.tsx
    - src/pages/WeChatNotice/index.tsx
    - src/components/layout/Header.tsx  # data-[side=left] 是变体，不是任意值
    - src/pages/Seating/index.tsx  # 预览宽度由字号计算
    - src/pages/Users/components/ExportModal.tsx  # 用户主题色
    - src/pages/Users/components/ImportModal.tsx  # 导入预览动态样式
    - src/pages/Settings/panels/ScriptsPanel.tsx
    - src/index.css
