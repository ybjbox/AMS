# AMS CI：六道闸门（类型 → lint → 单元测试 → 服务端验证 → 构建 → E2E）
# 说明：
#  - lint 是**阻塞**门槛：上游既有债务已在 commit 4cdb471 前后清零（当前 0 error；
#    warning 主要是 @typescript-eslint/no-explicit-any 与 React Compiler 的 incompatible-library 提示）。
#    历史这里挂过 continue-on-error（当时 193 error），债务清完却没摘标记 —— 2026-09-24 全系统检查发现并摘除。
#  - E2E 使用 Playwright：CI 环境自动安装 chromium 并自动启动服务器（含种子管理员）。
#    这条路的库是全新的，依赖演示数据（用例搜「员工 1」、要 45 人的分页、建员工时写「研发部」），
#    所以 playwright.config.ts 的 webServer 带着 AMS_SEED_DEMO=1 —— 别当成多余的开销删掉。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # v4 目标运行时是 Node 20，GitHub 已弃用并在强制改跑 Node 24（每次 run 都带告警）。
      # 三个 action 一起跳到当前主版本，理由（2026-10-11 核对过各版本发布说明）：
      #  - checkout v5 的破坏性改动只针对 pull_request_target 的不安全默认，本 workflow 只在 push 触发；
      #    v6/v7 只是把它回移到新分支，并加了转义/空白等修复。
      #  - setup-node v5 起默认 Node 24；它「package.json 里有 packageManager 字段就自动开缓存」
      #    那条对我们无影响（仓库没有该字段，且下面本来就显式 cache: npm）；v7 是 ESM 迁移 +
      #    不再导出占位 NODE_AUTH_TOKEN，本 workflow 没用那个变量。
      #  - upload-artifact v6 起默认 Node 24，v7 的直传功能要显式 archive: false 才启用，没启用。
      # 三者都要求 runner ≥ 2.327.1，GitHub 托管的 ubuntu-latest 满足。
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # --legacy-peer-deps：仓库内 eslint@10 与 eslint-plugin-react-hooks@7 的 peer 声明矛盾
      - name: 安装依赖
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: 类型检查（client + server）
        run: npm run typecheck

      - name: Lint（0 error 门槛）
        run: npm run lint

      - name: 前端与服务端单元测试（含死 UI 可达性守门）
        run: npm run test:run

      - name: 服务端验证脚本（19 个自包含回归，含鉴权网关/审计/外键/并发/导出沙箱）
        run: npm run test:server

      - name: 生产构建（含分包验证）
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: verify   # 快速闸门通过后才跑较慢的 E2E
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: 安装 Playwright Chromium
        run: npx playwright install chromium --with-deps

      # 口令每次运行现生成（runner 上的库是新播种的，跑完即弃）：
      # 仓库里不再保存默认口令，日志里也不会出现这个值。
      # 走 AMS_ADMIN_PASSWORD 这条路的 admin 不带 mustChangePassword，用例可直接登录。
      - name: 生成本次运行的 e2e 管理员口令
        id: e2e_pw
        run: echo "value=Ams$(openssl rand -hex 9)9" >> "$GITHUB_OUTPUT"

      - name: 运行 E2E 测试（自动启动服务器 + 种子管理员）
        run: npx playwright test --reporter=list
        env:
          CI: true
          AMS_ADMIN_PASSWORD: ${{ steps.e2e_pw.outputs.value }}
          TZ: Asia/Shanghai

      - name: 上传测试报告（失败时）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
